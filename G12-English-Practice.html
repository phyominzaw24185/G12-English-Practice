<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#241f1a; --muted:#7a6f62; --line:#e3d9c8;
  --accent:#9c3b1e; --accent-ink:#fff; --ok:#1f7a45; --okbg:#e5f4ea; --bad:#b3261e; --badbg:#fbe9e7; --sel:#f3e3d0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171410;--card:#211d18;--ink:#efe7da;--muted:#a09484;--line:#38312a;--accent:#e58a63;--accent-ink:#1a120c;--ok:#6fd09a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1f1c;--sel:#3a2f24}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Myanmar",system-ui,sans-serif;line-height:1.7;font-size:16px}
#app{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.en,.qt,.passage,.instr,.sh,.opt,.ans .a,h1,.num{font-family:"Source Serif 4",Georgia,"Noto Sans Myanmar",serif}
h1{font-size:1.5rem;line-height:1.25;margin:2px 0 6px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--accent);font-weight:700}
.lead{color:var(--muted);font-size:.92rem;margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:.9rem}
.back{color:var(--accent);text-decoration:none;font-weight:600}
.ex{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.ex input{accent-color:var(--accent);width:18px;height:18px}
/* home */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.ucard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:transform .12s}
.ucard:active{transform:scale(.98)}
.ucard .u{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.ucard .t{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.3;margin:2px 0 6px}
.ucard .s{font-size:.8rem;color:var(--muted)}
.ucard.off{opacity:.55;pointer-events:none;border-style:dashed}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
h3.gh{font-size:.8rem;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px;text-transform:uppercase}
/* unit */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:5;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:999px;font-size:.88rem;font-weight:600;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.stat{font-size:.85rem;color:var(--muted);flex:1 1 180px}
.stat b{color:var(--ink)}
.btn{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.sh{font-size:1.15rem;margin:18px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.blk{margin-bottom:14px}
.instr{font-weight:600;margin:10px 0 8px}
.mk{color:var(--muted);font-weight:400;font-size:.9em}
.grp{margin:16px 0 8px;text-align:center}
.grp span{display:inline-block;border:1.5px solid var(--ink);border-radius:8px;padding:2px 14px;font-weight:700;font-family:"Source Serif 4",Georgia,serif}
.passage{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 16px;margin:10px 0;font-size:1rem}
.passage .pl{font-weight:700;margin-bottom:4px}
.passage p{margin:.5em 0;text-align:justify}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0}
.q.done-ok{border-color:var(--ok)}
.q.done-bad{border-color:var(--bad)}
.qrow{display:flex;gap:8px}
.num{color:var(--muted);flex:none;min-width:2.1em;font-weight:600}
.qt{flex:1;font-size:1.02rem}
.blank{font:inherit;font-family:"Source Serif 4",Georgia,serif;border:0;border-bottom:2px solid var(--muted);background:transparent;color:var(--accent);font-weight:600;padding:0 4px;min-width:6em;max-width:100%;text-align:center;outline:none;border-radius:0}
.blank:focus{border-bottom-color:var(--accent);background:var(--sel)}
.blank.ok{border-bottom-color:var(--ok);color:var(--ok)}
.blank.bad{border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.ini{font-weight:600;white-space:nowrap}
.gap{color:var(--accent);font-weight:700;border-bottom:2px solid var(--muted);padding:0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin:8px 0 2px 2.1em}
@media(max-width:480px){.opts{margin-left:0}}
.opt{font-size:.98rem;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.opt b{color:var(--muted);font-size:.85em}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.opt.sel b{color:var(--accent-ink);opacity:.85}
.opt.sel span::after{content:" ✓"}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
textarea{width:100%;font:inherit;font-family:"Source Serif 4",Georgia,serif;font-size:1rem;margin-top:8px;min-height:64px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.ctl{margin-top:8px}
.tagrow{display:flex;justify-content:flex-end;margin:-2px 0 4px}
.yr{font-family:system-ui,sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:999px;background:#ffe27a;color:#4a3600;border:1px solid #e0b92e}
.yr.os{background:#bfe3ff;color:#06314f;border-color:#6fb6e8}
.pl .yr{margin-left:8px;vertical-align:middle}
@media(prefers-color-scheme:dark){.yr{background:#6b5410;color:#ffe9a3;border-color:#a8861f}.yr.os{background:#12476b;color:#cde9ff;border-color:#3b82b3}}
.ans{margin-top:9px;padding:8px 11px;border-radius:9px;background:var(--sel);font-size:.95rem}
.ans.ok{background:var(--okbg)}
.ans.bad{background:var(--badbg)}
.ans b{font-size:.9rem}
.ans.ok b{color:var(--ok)}.ans.bad b{color:var(--bad)}
.ans .a{font-weight:600}
.al{font-size:.75rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.self{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.self .btn.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.self .btn.on-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.xbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;margin:8px 0 12px;font-family:"Source Serif 4",Georgia,serif;font-size:.95rem}
.dl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:9px 0;font-family:"Source Serif 4",Georgia,serif}
.dl p{margin:.45em 0}.dl .who{font-weight:700}
.dl .bk{font-weight:600;white-space:nowrap}
.dl .bk.sh{color:var(--accent)}
.sh2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:9px 0;padding:0 13px}
.gp summary{cursor:pointer;padding:11px 0;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.05rem;display:flex;gap:10px;align-items:baseline;list-style:none}
.gp summary::-webkit-details-marker{display:none}
.gp summary::after{content:"+";margin-left:auto;color:var(--accent);font-size:1.3rem}
.gp[open] summary::after{content:"–"}
.gn{color:var(--muted);font-weight:600;min-width:1.6em}
.gpat{background:var(--sel);border-left:4px solid var(--accent);border-radius:6px;padding:6px 10px;font-family:"Source Serif 4",Georgia,serif;font-weight:700;margin:2px 0 8px}
.grule{margin:6px 0;font-family:"Source Serif 4",Georgia,serif}
.gex{border-top:1px dashed var(--line);padding:7px 0;font-family:"Source Serif 4",Georgia,serif}
.gtip{font-size:.88rem;color:var(--muted);padding:6px 0 11px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.foot{margin-top:30px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   DATA  — Add a new unit by appending one object to DATA
   f(q,a)   fill-in   : q with {s} = initial letter, {} = blank
   m(q,a,b,c,k) MCQ   : {} = blank, k = correct index (0=A,1=B,2=C)
   sh(q,a)  short answer
   ============================================================ */
const f=(q,a)=>({q,a});
const m=(q,a,b,c,k)=>({q,o:[a,b,c],a:k});
const sh=(q,a)=>({q,a});

const TITLES=["GOOD MANNERS","KEY TO HAPPINESS","DIET AND NUTRITION","EMOTIONAL WELL-BEING","COLOURS","ARTIFICIAL INTELLIGENCE","POLLUTION: A HAZARD TO OUR ENVIRONMENT","RENEWABLE ENERGY","HELEN KELLER","WHY IMPROVE COMMUNICATION SKILLS?","A DAY'S WAIT","INTERCULTURAL COMMUNICATION"];
const EXTRAS=["Poem","Unseen Passage","Letters","Essays"];

const ENVY="The biggest barrier to happiness is envy, which is a state of desiring other people's qualities, possessions, opportunities, etc. In your school or workplace, you will find yourself around people who are doing much better than you are. In that case, if you try not to judge yourself against other people, you will certainly be happier. People who are envious of others are more likely to experience negative emotions such as inferiority, dejection and depression. The best thing you should do is try to replace envy with such positive emotions as sympathy or empathetic joy.";

const KEY="g12eng_practice_v1";
let ST={};
try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){ST={}}

const st=k=>ST[k]||(ST[k]={v:"",r:0,c:null});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9']/g," ").replace(/\s+/g," ").trim();
const app=document.getElementById("app");


/* ================= GRAMMAR PATTERNS ================= */
const GRAMMAR=[
{t:"Nouns in apposition",p:"Sentence 1 (…, noun phrase,) + Sentence 2",r:"Turn one sentence into a noun phrase and put it right after the noun it describes, separated by commas. The noun phrase renames the noun.",ex:[["Bagan is the most famous ancient city in Myanmar. We will visit there next summer.","We will visit Bagan, the most famous ancient city in Myanmar, next summer."]],tip:"Use commas on both sides if the phrase is in the middle of the sentence."},
{t:"Either … or / Neither … nor",p:"either A or B  ·  neither A nor B",r:"Either…or = one of two choices. Neither…nor = not one and not the other (negative meaning already, so no other 'not'). The verb agrees with the noun nearest to it.",ex:[["We do not believe him and neither does she.","Neither we nor she believes him."],["He may come today. He may come tomorrow.","He will come either today or tomorrow."]],tip:"Keep both parts in the same grammatical form."},
{t:"Reported speech (statements)",p:"S + said (that) + backshifted clause",r:"Tense goes one step back: am/is → was, are → were, do/does → did, will → would, can → could, has/have/had done → had done, past simple → past perfect. Pronouns change to fit the speaker. Time words change: today → that day, tomorrow → the next day, yesterday → the day before, now → then, here → there, this → that.",ex:[["“I am tired,” she said.","She said that she was tired."]],tip:"No backshift is needed when the reporting verb is present tense or the statement is always true."},
{t:"Reported speech (questions)",p:"S + asked + (wh-word / if / whether) + S + V",r:"Use normal statement word order, no question mark, and no do/does/did. Yes/no questions take if or whether. Backshift the tense as in reported statements.",ex:[["Zaw Zaw asked, “Why haven't you come to our Soon-kyway yesterday?”","Zaw Zaw asked why she had not come to their Soon-kyway the day before."],["“Do you like tea?” he asked.","He asked if/whether I liked tea."]],tip:"Questions → word order goes back to S + V."},
{t:"Reported speech (commands / requests)",p:"S + told/asked + O + (not) to + verb",r:"Commands and requests become a to-infinitive. Negative: not to + verb.",ex:[["“Close the door,” she said to me.","She told me to close the door."],["“Don't be late,” he said.","He told me not to be late."]],tip:""},
{t:"Passive voice",p:"be + past participle (+ by agent)",r:"The object of the active sentence becomes the subject. Keep the same tense in the form of be: present simple: am/is/are + V3; past simple: was/were + V3; present perfect: has/have been + V3; future: will be + V3; modal: modal + be + V3. The doer goes after 'by' (can be left out if unimportant).",ex:[["Workers weave silk thread into beautiful shirts.","Silk thread is woven into beautiful shirts by workers."],["The teachers are giving the students a day off.","The students are being given a day off by the teachers."]],tip:"Continuous passive: am/is/are/was/were + being + V3."},
{t:"in order that / provided that / even though",p:"Sentence 1 + conjunction + Sentence 2",r:"in order that = purpose (so that). provided that = condition (only if). even though = contrast (in spite of the fact that). Choose the one that fits the meaning of the two sentences.",ex:[["I had two hours to spare for shopping. I couldn't find the suit I wanted.","Even though I had two hours to spare for shopping, I couldn't find the suit I wanted."],["You may go out. You must finish your homework first.","You may go out provided that you finish your homework."],["She saved money. She could buy a house.","She saved money in order that she could buy a house."]],tip:"After in order that, use can/could/will/would."},
{t:"Relative pronouns and adverbs",p:"who · whom · whose · which · that · where · when · why",r:"who = person (subject). whom = person (object). whose = possession. which = thing. that = person or thing (not after a comma). where = place. when = time. why = reason. A clause that adds extra information is set off with commas.",ex:[["A police officer stopped and arrested the robbers. His car was parked at the next corner.","A police officer whose car was parked at the next corner stopped and arrested the robbers."],["This is the town. I was born there.","This is the town where I was born."]],tip:"Put the relative clause right after the noun it describes."},
{t:"Cleft sentences (It is / was … who / that)",p:"It is/was + focus + who/that + rest",r:"Used to stress one part of a sentence. Move the part you want to stress right after It is/was, then add who (for people) or that (for things, time, place) and the rest of the sentence.",ex:[["The acrobat crossed the tightrope steadily.","It was the acrobat who crossed the tightrope steadily."],["Mya Mya bought the book yesterday.","It was the book that Mya Mya bought yesterday."]],tip:"The verb after who/that keeps the same tense as the original."},
{t:"No matter + wh-word",p:"No matter + who/what/where/when/how + S + V, main clause",r:"Means 'whatever happens' — the main clause stays true in any case. ‘No matter whether … or …’ links two alternatives. Use a comma before the main clause.",ex:[["He is found innocent, or he is found guilty. Nonetheless, his reputation is permanently damaged.","No matter whether he is found innocent or guilty, his reputation is permanently damaged."],["However hard he tries, he cannot win.","No matter how hard he tries, he cannot win."]],tip:"No matter + verb 'be' keeps normal word order."},
{t:"Third conditional",p:"If + S + had + V3, S + would/could/might + have + V3",r:"Imagines a different past, so the result did not happen. Use it for regret or an unreal past situation. A negative fact becomes a positive if-clause, and a positive result becomes would have + V3 (or reverse).",ex:[["She didn't switch on the lights, so she fell over the chair.","If she had switched on the lights, she would not have fallen over the chair."]],tip:"Do not use would have in the if-clause."},
{t:"Not only … but also",p:"Not only + auxiliary + S + V, but S + also + V",r:"Joins two facts and stresses the first. After a sentence starting with ‘Not only’, the auxiliary comes before the subject (inversion). If there is no auxiliary, use do/does/did.",ex:[["The teachers are giving the students a day off. The principal is giving the students a day off.","Not only are the teachers giving the students a day off, but the principal is also giving them a day off."],["She sings. She dances.","Not only does she sing, but she also dances."]],tip:"Do not invert the clause that follows ‘but’."},
{t:"Second conditional",p:"If + S + V2 / were, S + would + V",r:"Unreal or unlikely situation in the present or future. With be, use were for all subjects.",ex:[["I am not rich, so I can't buy a car.","If I were rich, I could buy a car."]],tip:"If I were you, I would …  = giving advice."},
{t:"First conditional",p:"If + S + V1, S + will + V",r:"Real or likely situation in the future. Unless = if … not.",ex:[["Study hard or you will fail.","If you don't study hard, you will fail."],["If you don't hurry, you'll be late.","Unless you hurry, you'll be late."]],tip:""},
{t:"Wish",p:"S + wish + S + V2 / had V3",r:"Present wish (unreal now): wish + past simple (were for be). Past regret: wish + had + V3. Future/complaint: wish + would.",ex:[["I don't have a car.","I wish I had a car."],["I didn't study.","I wish I had studied."]],tip:"Formal: I wish I were …"},
{t:"Joining with participle phrases",p:"V-ing … / Having + V3 …",r:"When two actions have the same subject, one can become a participle phrase. V-ing = actions at the same time; Having + V3 = the first action finished before the second.",ex:[["She opened the door. She saw a stranger.","Opening the door, she saw a stranger."],["He finished his work. He went home.","Having finished his work, he went home."]],tip:"The subject of both parts must be the same."},
{t:"Too … to / enough … to / so … that",p:"too adj to V · adj enough to V · so adj that + clause",r:"too…to = more than needed, negative result. enough…to = sufficient, positive result. so…that / such…that = result clause.",ex:[["The tea is so hot that I can't drink it.","The tea is too hot for me to drink."],["He is strong. He can lift the box.","He is strong enough to lift the box."]],tip:"too … to has a negative meaning, so no 'not' is needed."},
{t:"Although / Despite / In spite of",p:"Although + clause · Despite/In spite of + noun / V-ing",r:"All show contrast. Although is followed by S + V. Despite / in spite of are followed by a noun, pronoun or V-ing.",ex:[["Although it rained, we went out.","In spite of the rain, we went out."],["He was tired. He kept working.","Despite being tired, he kept working."]],tip:"Do not use ‘but’ together with although."},
{t:"Because / Because of / Owing to",p:"Because + clause · Because of / Owing to + noun / V-ing",r:"They show a reason. Because is followed by S + V; because of and owing to are followed by a noun phrase.",ex:[["He was late because the bus broke down.","He was late because of the bus breakdown."]],tip:""}
];

const INDEX={};
DATA.forEach(u=>u.secs.forEach((s,si)=>s.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
  INDEX[`${u.id}.${si}.${bi}.${ii}`]={it,blk:b,type:b.type,num:(b.start||1)+ii,u:u.id,si};
}))));
const keysOf=(u,si)=>Object.keys(INDEX).filter(k=>INDEX[k].u===u.id&&(si==null||INDEX[k].si===si));
function stats(u,si){
  let t=0,d=0,c=0;
  keysOf(u,si).forEach(k=>{t++;const x=ST[k];if(x&&x.c!=null){d++;if(x.c)c++;}});

const statHTML=s=>`Checked <b>${s.d}</b> / ${s.t} · Correct <b style="color:var(--ok)">${s.c}</b>`;

function grade(I,x){
  if(I.type==="mcq")return x.v===I.it.a;
  return [].concat(I.it.a).map(norm).includes(norm(x.v||""));
}
function itemHTML(k){
  const I=INDEX[k],x=st(k),it=I.it,rev=x.r===1,exam=!!ST._exam;
  const kp=k.split('.'),tg=(TAGS[kp.slice(0,3).join('.')]||'').split(' ')[+kp[3]];
  const cls=rev?(x.c===true?"ok":x.c===false?"bad":""):"";
  let body="";
  if(I.type==="fill"){
    const t=esc(it.q).replace(/\{([^}]*)\}/g,(_,l)=>`<span class="ini">${esc(l)}---------</span>`).replace(/\n/g,"<br>");
    body=`<div class="qrow"><span class="num">(${I.num})</span><div class="qt">${t}</div></div>`;
  }else if(I.type==="mcq"){
    const sel=x.v;
    const t=esc(it.q).replace("{}",`<span class="ini">---------</span>`);
    body=`<div class="qrow"><span class="num">(${I.num})</span><div class="qt">${t}</div></div><div class="opts">`+
      it.o.map((o,i)=>{let c="opt";if(rev){if(i===it.a)c+=" ok";else if(i===sel)c+=" bad";}else if(i===sel)c+=" sel";
        return `<button class="${c}" data-act="opt" data-k="${k}" data-i="${i}"><b>${"ABC"[i]}</b><span>${esc(o)}</span></button>`}).join("")+`</div>`;
  }else if(I.type==="dlg"){
    const b=I.blk,ans=it.a;
    const L=b.lines.map(([w,t])=>{
      const tx=esc(t).replace(/\{(\d)\}/g,(_,n)=>rev?`<span class="bk" style="color:var(--ok)">(${n}) ${esc(ans[n-1])}</span>`:`<span class="bk">(${n}) ---------</span>`);
      return `<p><span class="who">${esc(w)}:</span> ${tx}</p>`}).join("");
    body=`<div class="dl">${L}</div>`;
  }else{
    body=`<div class="qrow"><span class="num">(${I.num})</span><div class="qt">${esc(it.q)}</div></div>`;
  }
  let ans="";
  if(rev){
    if(I.type!=="mcq"){
      ans=`<div class="ans"><div class="al">ANSWER</div><div class="a">${I.type==="dlg"?it.a.map((a,i)=>`(${i+1}) ${esc(a)}`).join("<br>"):esc([].concat(it.a).join(" / ").replace(/\n/g," "))}</div>
        <div class="self"><button class="btn ${x.c===true?"on-ok":""}" data-act="self" data-k="${k}" data-v="1">✓ I got it right</button><button class="btn ${x.c===false?"on-bad":""}" data-act="self" data-k="${k}" data-v="0">✗ Needs review</button></div></div>`;
    }else{
      const at=I.type==="mcq"?`${"ABC"[it.a]}) ${esc(it.o[it.a])}`:esc([].concat(it.a).join(" / "));
      ans=`<div class="ans ${cls}"><b>${x.c?"✓ Correct":"✗ Wrong"}</b> · Answer: <span class="a">${at}</span></div>`;
    }
  }
  const btn=exam?"":`<div class="ctl"><button class="btn" data-act="rev" data-k="${k}">${rev?"Hide answer":"Show answer"}</button></div>`;
  const dc=rev&&x.c===true?" done-ok":rev&&x.c===false?" done-bad":"";
  return `<div class="q${dc}" data-q="${k}">${tg?`<div class="tagrow">${tagHTML(tg)}</div>`:""}${body}${btn}${ans}</div>`;
}
function secHTML(u,si){
  const s=u.secs[si];
  let h=`<h2 class="sh">${esc(s.name)} ${s.tag?tagHTML(s.tag):""}</h2>`;if(s.note)h+=`<div class="ans bad" style="margin:8px 0">${esc(s.note)}</div>`;
  if(s.passage)h+=`<div class="passage"><div class="pl">Read the passage. ${tagHTML(PTAGS[u.id+"."+si])}</div>${s.passage.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
  s.blocks.forEach((b,bi)=>{
    h+=`<div class="blk"><div class="instr">${b.label?`<b>${b.label}</b> `:""}${esc(b.instr)} <span class="mk">(${b.marks} marks)</span></div>${b.box?`<div class="xbox">${b.box.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}`;
    b.items.forEach((it,ii)=>{

}

function route(){
  if(location.hash==="#g"){gView();window.__u=null;window.scrollTo(0,0);return;}
  const mt=/^#u(\d+)s(\d+)$/.exec(location.hash);
  const u=mt&&DATA.find(d=>d.id===+mt[1]);
  const prev=window.__tabsL||0,prevU=window.__u;
  if(u&&u.secs[+mt[2]]){
    unitView(u,+mt[2]);
    const nav=document.querySelector(".tabs"),on=nav&&nav.querySelector(".tab.on");
    if(nav&&on){
      if(prevU===u.id)nav.scrollLeft=prev;
      const l=on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2;
      if(on.offsetLeft<nav.scrollLeft||on.offsetLeft+on.offsetWidth>nav.scrollLeft+nav.clientWidth)nav.scrollLeft=Math.max(0,l);
      window.__tabsL=nav.scrollLeft;
      nav.addEventListener("scroll",()=>{window.__tabsL=nav.scrollLeft},{passive:true});
    }
    window.__u=u.id;
    const sec=document.getElementById("sec");
    window.scrollTo(0,prevU===u.id&&sec?Math.max(0,sec.getBoundingClientRect().top+window.scrollY-120):0);

}

  else if(a==="hideall"){
    const u=DATA.find(d=>d.id===+b.dataset.u),si=+b.dataset.s;
    keysOf(u,si).forEach(kk=>setReveal(kk,false));
    unitView(u,si);
  }
  else if(a==="reset"){
    
    const u=DATA.find(d=>d.id===+b.dataset.u),si=+b.dataset.s;
    keysOf(u,si).forEach(kk=>delete ST[kk]);save();unitView(u,si);
  }
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==="inp"){st(t.dataset.k).v=t.value;save();}
});
app.addEventListener("change",e=>{
  if(e.target.id==="exm"){ST._exam=e.target.checked;save();const c=cur();if(c)unitView(c.u,c.si);}
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.classList.contains("blank")){
    e.preventDefault();const k=e.target.dataset.k;setReveal(k,true);refreshItem(k);
  }
});
window.addEventListener("hashchange",route);
route();
</script>
</body>
